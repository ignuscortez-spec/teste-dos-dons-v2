<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Prova do envio — iPhone</title>
<style>
  :root { color-scheme: light; }
  body { margin:0; padding:24px; font:16px/1.5 -apple-system,system-ui,sans-serif;
         background:#f3f6f4; color:#1f2a24; }
  h1 { font-size:20px; margin:0 0 4px; color:#173627 }
  p  { margin:0 0 18px; font-size:14px; color:#6b7280 }
  button { width:100%; padding:18px; font-size:18px; font-weight:700; border:0; border-radius:14px;
           background:#173627; color:#fff; }
  button:disabled { background:#8fbfa6 }
  #r { margin-top:20px; padding:16px; border-radius:14px; background:#fff;
       border:1px solid #dfe7e3; font-size:15px; white-space:pre-wrap; word-break:break-word }
  .ok  { color:#166534; font-weight:700 }
  .nao { color:#b4530b; font-weight:700 }
</style>
</head>
<body>
<h1>Prova do envio no iPhone</h1>
<p>Página temporária. Faz exatamente o mesmo envio do Teste dos Dons, sem as 180 afirmações.</p>

<button id="b">Enviar resultado de teste</button>
<div id="r">Aguardando.</div>

<script>
const COLETOR = "https://marvin.idagent.cloud/dons-coletar";
const DONS = ["Ensino","Liderança","Fé","Hospitalidade","Oração (Intercessão)"];
const r = document.getElementById("r"), b = document.getElementById("b");

b.onclick = async () => {
  b.disabled = true; r.textContent = "Enviando…";
  const t0 = Date.now();
  const corpo = {
    nome: "PROVA IPHONE (apagar)", whatsapp: "67900000099", rede: "Mídia e Comunicação",
    manifestos: DONS.map((d,i) => ({dom:d, pontos:20-i})),
    latentes:   DONS.map((d,i) => ({dom:d, pontos:10-i})),
    todos: Array.from({length:30}, (_,i) => (i % 9) + 6),
    respostas: Array.from({length:180}, (_,i) => i % 5)
  };
  try {
    const resp = await fetch(COLETOR, {
      method: "POST",
      headers: {"Content-Type": "text/plain;charset=UTF-8"},
      body: JSON.stringify(corpo)
    });
    const txt = await resp.text();
    r.innerHTML = '<span class="ok">CHEGOU NO SERVIDOR</span>\n\nresposta: ' + txt +
                  '\ncódigo: ' + resp.status + '\ntempo: ' + (Date.now()-t0) + ' ms' +
                  '\n\nnavegador: ' + navigator.userAgent;
  } catch (e) {
    r.innerHTML = '<span class="nao">FALHOU</span>\n\n' + e +
                  '\n\nnavegador: ' + navigator.userAgent;
  }
  b.disabled = false;
};
</script>
</body>
</html>
